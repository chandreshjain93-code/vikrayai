<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VikrayAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-amber-50 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <!-- Header -->
    <header class="bg-white rounded-3xl shadow p-6 mb-8 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">V</div>
        <div>
          <h1 class="text-3xl font-bold text-emerald-700">VikrayAI</h1>
          <p class="text-gray-500">AI for Kirana Stores</p>
        </div>
      </div>
      <div class="text-right">
        Jaipur Market Live<br>
        <span class="text-emerald-600">CA Chandresh</span>
      </div>
    </header>

    <div class="grid md:grid-cols-12 gap-6">
      <!-- Sidebar -->
      <div class="md:col-span-4 space-y-6">
        <div class="bg-white rounded-3xl p-6 shadow">
          <h2 class="font-semibold mb-4">Today's Summary • 02 Jun</h2>
          <div class="space-y-6">
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Profit</span><span class="font-bold text-emerald-600">₹1,240</span></div>
              <div class="h-2 bg-gray-100 rounded-full"><div class="h-2 bg-emerald-500 rounded-full w-4/5"></div></div>
            </div>
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Stock Value</span><span class="font-bold">₹18,450</span></div>
            </div>
          </div>
        </div>

        <button onclick="showPricing()" class="w-full py-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl font-medium">
          💰 Pro Plan - ₹99/month
        </button>
      </div>

      <!-- Chat -->
      <div class="md:col-span-8 bg-white rounded-3xl shadow-xl flex flex-col h-[620px]">
        <div class="p-6 border-b bg-emerald-50 rounded-t-3xl">
          <h3 class="font-semibold">AI Business Assistant</h3>
          <p class="text-sm text-emerald-600">Smart AI • Hindi + English</p>
        </div>
        
        <div id="chat" class="flex-1 p-6 overflow-y-auto space-y-6"></div>

        <!-- Input Box -->
        <div class="p-6 border-t bg-white rounded-b-3xl">
          <div class="flex gap-3">
            <input id="input" type="text" placeholder="टमाटर का price क्या रखूँ?" 
                   class="flex-1 border-2 border-gray-300 rounded-3xl px-6 py-5 text-lg focus:outline-none focus:border-emerald-500"
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-12 py-5 rounded-3xl font-medium text-lg">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = isUser ? 'flex justify-end' : 'flex justify-start';
      div.innerHTML = `<div class="${isUser ? 'bg-emerald-600 text-white' : 'bg-gray-100'} rounded-3xl px-6 py-4 max-w-[80%]">${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    addMessage("नमस्ते! मैं विक्रयAI हूँ। आज आपके बिजनेस में कैसे मदद करूँ?", false);

    function sendMessage() {
      const input = document.getElementById('input');
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, true);
      input.value = "";

      setTimeout(() => {
        let reply = "समझ गया। और बताओ क्या मदद चाहिए?";

        const q = question.toLowerCase();
        if (q.includes("टमाटर") || q.includes("tomato") || q.includes("price")) reply = "टमाटर का आज का सुझावित मूल्य ₹20-23/kg रख सकते हो।";
        if (q.includes("profit") || q.includes("मुनाफा")) reply = "आज का मुनाफा ₹1240 है। बहुत बढ़िया!";
        if (q.includes("stock")) reply = "25kg टमाटर बचा है। आज डिस्काउंट देकर बेच लो।";

        addMessage(reply, false);
      }, 500);
    }

    function showPricing() {
      alert("Pro Plan - ₹99/month\n\n• Unlimited AI Chat\n• Smart Pricing Suggestions\n• Stock Management\n• Daily Reports\n\nContact: CA Chandresh");
    }
  </script>
</body>
</html>
