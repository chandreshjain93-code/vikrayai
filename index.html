<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VikrayAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-amber-50 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="bg-white rounded-3xl shadow p-6 mb-8 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">V</div>
        <div>
          <h1 class="text-3xl font-bold text-emerald-700">VikrayAI</h1>
          <p class="text-gray-500">AI for Kirana Stores</p>
        </div>
      </div>
      <div class="text-right">
        Jaipur Market Live<br>
        <span class="text-emerald-600 font-medium">CA Chandresh</span>
      </div>
    </header>

    <div class="grid md:grid-cols-12 gap-6">
      <!-- Editable Summary -->
      <div class="md:col-span-4 space-y-6">
        <div class="bg-white rounded-3xl p-6 shadow">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold">Today's Summary • 02 Jun</h2>
            <button onclick="toggleEdit()" class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full">Edit Mode</button>
          </div>
          
          <div class="space-y-6">
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Profit</span><span id="profit-val" class="font-bold text-emerald-600">₹1,240</span></div>
              <input id="profit-input" type="text" value="1240" class="hidden w-full border rounded px-3 py-1 text-sm">
            </div>
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Sales</span><span id="sales-val" class="font-bold">₹18,900</span></div>
              <input id="sales-input" type="text" value="18900" class="hidden w-full border rounded px-3 py-1 text-sm">
            </div>
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Outstanding</span><span id="outstanding-val" class="font-bold">₹6,450</span></div>
              <input id="outstanding-input" type="text" value="6450" class="hidden w-full border rounded px-3 py-1 text-sm">
            </div>
          </div>
        </div>

        <button onclick="showPricing()" class="w-full py-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl font-medium">
          💰 Pro Plan - ₹99/month
        </button>
      </div>

      <!-- Chat Area -->
      <div class="md:col-span-8 bg-white rounded-3xl shadow-xl flex flex-col h-[620px]">
        <div class="p-6 border-b bg-emerald-50 rounded-t-3xl">
          <h3 class="font-semibold">ChatGPT Assistant</h3>
        </div>
        <div id="chat" class="flex-1 p-6 overflow-y-auto"></div>
        <div class="p-6 border-t">
          <div class="flex gap-3">
            <input id="input" type="text" placeholder="टमाटर का price क्या रखूँ?" class="flex-1 border-2 rounded-3xl px-6 py-5">
            <button onclick="sendMessage()" class="bg-emerald-600 text-white px-12 py-5 rounded-3xl">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isEditing = false;

    function toggleEdit() {
      isEditing = !isEditing;
      document.getElementById('profit-input').classList.toggle('hidden', !isEditing);
      document.getElementById('sales-input').classList.toggle('hidden', !isEditing);
      document.getElementById('outstanding-input').classList.toggle('hidden', !isEditing);
    }

    // Auto update displayed values when editing
    ['profit', 'sales', 'outstanding'].forEach(field => {
      const input = document.getElementById(field + '-input');
      input.addEventListener('input', () => {
        document.getElementById(field + '-val').textContent = '₹' + input.value;
      });
    });

    // Chat functionality (same as before)
    function addMessage(text, isUser) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `mb-4 ${isUser ? 'text-right' : 'text-left'}`;
      div.innerHTML = `<div class="inline-block max-w-[80%] p-4 rounded-3xl ${isUser ? 'bg-emerald-600 text-white' : 'bg-gray-100'}">${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    addMessage("नमस्ते! आज कैसे मदद करूँ?", false);

    async function sendMessage() {
      // ... (same ChatGPT code as previous version)
      alert("ChatGPT feature coming in next update");
    }

    function showPricing() {
      alert("Pro Plan - ₹99/month\n\n• Unlimited AI\n• Editable Dashboard\n• Voice Input\n• Stock Management");
    }
  </script>
</body>
</html>
