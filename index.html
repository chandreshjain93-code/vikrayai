        <div class="p-6 border-t bg-white rounded-b-3xl">
          <div class="flex gap-3">
            <input id="input" 
                   type="text" 
                   placeholder="टमाटर का price क्या रखूँ?" 
                   class="flex-1 border-2 border-emerald-300 focus:border-emerald-500 rounded-3xl px-6 py-5 text-lg focus:outline-none"
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-5 rounded-3xl font-medium text-lg min-w-[100px]">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
