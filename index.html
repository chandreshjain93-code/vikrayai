<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VikrayAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .chat-message { max-width: 80%; padding: 12px 16px; border-radius: 20px; margin-bottom: 12px; }
    .user { background: #047857; color: white; margin-left: auto; }
    .assistant { background: #f3f4f6; }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-amber-50 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="bg-white rounded-3xl shadow p-6 mb-8 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">V</div>
        <div>
          <h1 class="text-3xl font-bold text-emerald-700">VikrayAI</h1>
          <p class="text-gray-500">AI for Kirana Stores</p>
        </div>
      </div>
      <div class="text-right">
        Jaipur Market Live<br>
        <span class="text-emerald-600 font-medium">CA Chandresh</span>
      </div>
    </header>

    <div class="grid md:grid-cols-12 gap-6">
      <!-- Sidebar Summary -->
      <div class="md:col-span-4 space-y-6">
        <div class="bg-white rounded-3xl p-6 shadow">
          <h2 class="font-semibold mb-4">Today's Summary • 02 Jun</h2>
          <div class="space-y-6">
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Profit</span><span class="font-bold text-emerald-600">₹1,240</span></div>
              <div class="h-2 bg-gray-100 rounded-full"><div class="h-2 bg-emerald-500 rounded-full w-4/5"></div></div>
            </div>
            <div>
              <div class="flex justify-between mb-1"><span class="text-gray-600">Stock Value</span><span class="font-bold">₹18,450</span></div>
            </div>
          </div>
        </div>

        <button onclick="showPricing()" class="w-full py-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl font-medium">
          💰 Pro Plan - ₹99/month
        </button>
      </div>

      <!-- Main Chat Area -->
      <div class="md:col-span-8 bg-white rounded-3xl shadow-xl flex flex-col h-[620px]">
        <div class="p-6 border-b bg-emerald-50 rounded-t-3xl flex justify-between">
          <div>
            <h3 class="font-semibold">ChatGPT Assistant</h3>
            <p class="text-sm text-emerald-600">Real AI Responses</p>
          </div>
          <input id="apiKey" type="password" placeholder="Paste your OpenAI API key here" 
                 class="border border-gray-300 rounded-xl px-4 py-2 text-sm w-80 focus:outline-none focus:border-emerald-500">
        </div>
        
        <div id="chat" class="flex-1 p-6 overflow-y-auto space-y-4"></div>

        <div class="p-6 border-t">
          <div class="flex gap-3">
            <input id="input" type="text" placeholder="टमाटर का price क्या रखूँ?" 
                   class="flex-1 border-2 border-gray-300 rounded-3xl px-6 py-5 focus:outline-none focus:border-emerald-500"
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-12 py-5 rounded-3xl font-medium">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = isUser ? 'flex justify-end' : 'flex justify-start';
      div.innerHTML = `<div class="chat-message ${isUser ? 'user' : 'assistant'}">${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    addMessage("नमस्ते! अपना OpenAI API Key ऊपर डालें और पूछें।", false);

    async function sendMessage() {
      const input = document.getElementById('input');
      const apiKeyInput = document.getElementById('apiKey');
      const question = input.value.trim();
      
      if (!question) return;
      if (!apiKeyInput.value.trim()) {
        alert("Please enter your OpenAI API key first!");
        return;
      }

      addMessage(question, true);
      input.value = "";

      const loading = document.createElement('div');
      loading.innerHTML = `<div class="chat-message assistant">ChatGPT सोच रहा है...</div>`;
      chat.appendChild(loading);

      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKeyInput.value.trim()}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "You are VikrayAI, a helpful AI for Indian kirana store owners. Answer in simple Hindi or Hinglish." },
              { role: "user", content: question }
            ]
          })
        });

        const data = await res.json();
        loading.remove();
        addMessage(data.choices[0].message.content, false);
      } catch (e) {
        loading.remove();
        addMessage("❌ Error: Check your API key and credits.", false);
      }
    }

    function showPricing() {
      alert("Pro Plan - ₹99/month\n\n• Unlimited Messages\n• Voice Input\n• Stock Management\n\nContact: CA Chandresh");
    }
  </script>
</body>
</html>
